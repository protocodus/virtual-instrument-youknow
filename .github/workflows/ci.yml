name: CI

on:
  push:
    branches: ['**']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# Superseded PR checks can stop, but every main push must finish its packages.
# A run-specific group also prevents pending main runs from replacing each other.
concurrency:
  group: ci-${{ github.ref != 'refs/heads/main' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# release.yml runs this workflow, so its plug-ins are validated here;
# main-build.yml validates its own.

jobs:
  dsp-tests:
    name: DSP tests (JUCE-free, Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test CI packaging and preview refresh
        run: python3 scripts/test-ci-packaging.py

      - name: Install JUCE Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config xvfb xauth \
            libasound2-dev \
            libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev

      - name: Configure
        run: |
          cmake \
            -S . \
            -B build-dsp \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DYOUKNOW_BUILD_PLUGIN=OFF \
            -DYOUKNOW_REQUIRE_PYTHON_TESTS=ON \
            -DBUILD_TESTING=ON

      - name: Build and test DSP engine
        run: |
          cmake --build build-dsp --parallel
          ctest --test-dir build-dsp -L unit --output-on-failure --no-tests=error

      # The local listening renders are not committed, so this is what keeps
      # them working. The count turns "the renderers ran" into "they rendered
      # the whole set": 6 technique takes, 5 showcases and the composition.
      # Adding or removing a take means updating the number here. The README's
      # preset and More demos are the audio tier.
      - name: Render and verify the local listening set
        run: |
          set -euo pipefail
          cmake --build build-dsp --target YouKnowRenderListening --parallel
          rendered=$(find build-dsp/listening -maxdepth 1 -name '*.wav' | wc -l)
          if (( rendered != 12 )); then
            echo "error: rendered $rendered listening WAVs, expected 12" >&2
            exit 1
          fi
          test -f build-dsp/listening/showcase-manifest.json
          piece=build-dsp/listening/youknow-composition.wav
          test -f "$piece"
          bytes=$(stat -c%s "$piece")
          if (( bytes < 10000000 )); then
            echo "error: the composition is only $bytes bytes" >&2
            exit 1
          fi
          echo "YouKnow: rendered all $rendered listening WAVs and verified composition ($bytes bytes)"

      - name: Configure Linux plug-in build
        run: |
          cmake \
            -S . \
            -B build-dsp \
            -DCMAKE_BUILD_TYPE=Release \
            -DYOUKNOW_BUILD_PLUGIN=ON \
            -DYOUKNOW_BUILD_CLAP=ON \
            -DBUILD_TESTING=ON

      - name: Build Linux plug-ins and host-boundary tests
        run: |
          cmake --build build-dsp --parallel \
            --target YouKnow_VST3 YouKnow_CLAP YouKnow_Standalone \
              YouKnowPluginProcessorTests YouKnowCLAPBundleSmokeTests \
              YouKnowVST3BundleSmokeTests

      - name: Test Linux processor and plug-in host boundaries
        run: |
          set -euo pipefail
          # The editor fixture and JUCE host initialise GUI services. Give them
          # an isolated display; require each registration, not just any match.
          for suite in PluginProcessor CLAPBundle VST3Bundle; do
            xvfb-run --auto-servernum ctest --test-dir build-dsp \
              --output-on-failure -R "^YouKnow\\.${suite}$" --no-tests=error
          done

      - name: Validate the plug-ins (pluginval, clap-validator, auval on macOS)
        shell: bash
        run: ./scripts/validate-plugins.sh build-dsp YouKnow aumu Yk06 Ykno 0x594b4e4f

      - name: Package Linux VST3, CLAP and standalone
        run: python3 scripts/package-linux.py --build-dir build-dsp

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: ci-linux
          path: |
            build-dsp/dist/YouKnow-*-Linux-x64.tar.gz
            build-dsp/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  # The audio tier renders the preset and More demos twice and compares the bytes.
  audio-demos:
    name: Audio tier (every README demo, deterministic)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ninja
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ninja-build

      - name: Build the preset demo renderer
        run: |
          cmake -S . -B build-dsp -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DYOUKNOW_BUILD_PLUGIN=OFF -DBUILD_TESTING=ON
          cmake --build build-dsp --parallel --target RenderYouKnowPresetDemos

      - name: Audio tier
        run: ctest --test-dir build-dsp -L '^audio$' --no-tests=error --output-on-failure

  # U7: the preset demos timed on one thread and the engine's wall-clock
  # fences. Fails above the budget in Tools/RenderPresetDemos.cpp; the figures
  # are printed for the record.
  perf:
    name: Perf tier (demo CPU budget, engine fences)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Ninja
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ninja-build

      - name: Build the renderer and the engine suite
        run: |
          cmake -S . -B build-dsp -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DYOUKNOW_BUILD_PLUGIN=OFF -DBUILD_TESTING=ON
          cmake --build build-dsp --parallel --target RenderYouKnowPresetDemos YouKnowEngineTests

      - name: Perf tier
        run: |
          ctest --test-dir build-dsp -L '^perf$' --no-tests=error --output-on-failure
          cat build-dsp/cpu.json

  plugin-macos:
    name: Plug-in build and package (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The bundle-version checks require macOS and are skipped by the Linux
      # script job. Preflight uses disposable sources and mocked signing tools.
      - name: Test macOS packaging and release preflight
        run: |
          python3 scripts/test-ci-packaging.py
          bash scripts/test-release-preflight.sh

      # Every tier but audio (its own job), including the render tier's screenshot.
      - name: Build universal plug-in and run tests
        env:
          BUILD_UNIVERSAL: "ON"
          TEST_LABEL: "^(unit|render|fuzz)$"
        run: ./scripts/build-macos.sh

      - name: Check that the render tier wrote the editor screenshot
        run: |
          set -euo pipefail
          screenshot="build-macos/render/youknow.png"
          if [[ ! -s "$screenshot" ]]; then
            echo "error: the render tier did not write $screenshot" >&2
            exit 1
          fi
          if [[ "$(head -c 8 "$screenshot" | od -An -tx1 | tr -d ' \n')" != "89504e470d0a1a0a" ]]; then
            echo "error: $screenshot does not carry the PNG signature" >&2
            exit 1
          fi
          if [[ "$(tail -c 8 "$screenshot" | od -An -tx1 | tr -d ' \n')" != "49454e44ae426082" ]]; then
            echo "error: $screenshot has no terminating IEND chunk, so the write did not finish" >&2
            exit 1
          fi
          echo "Rendered $screenshot ($(wc -c < "$screenshot") bytes)."

      - name: Validate the plug-ins (pluginval, clap-validator, auval on macOS)
        shell: bash
        run: ./scripts/validate-plugins.sh build-macos YouKnow aumu Yk06 Ykno 0x594b4e4f

      - name: Upload the rendered editor screenshot
        uses: actions/upload-artifact@v4
        with:
          name: ci-screenshot
          path: build-macos/render/youknow.png
          if-no-files-found: error
          retention-days: 7

      - name: Package macOS VST3, Audio Unit, CLAP and standalone
        run: ./scripts/sign-and-package-macos.sh

      - name: Verify macOS packages and write checksums
        run: |
          set -euo pipefail
          cache="build-macos/CMakeCache.txt"
          version="$(sed -n 's/^CMAKE_PROJECT_VERSION:STATIC=//p' "$cache")"
          build_number="$(sed -n 's/^YOUKNOW_BUILD_NUMBER:STRING=//p' "$cache")"
          distribution_version="$(sed -n 's/^YOUKNOW_DISTRIBUTION_VERSION:INTERNAL=//p' "$cache")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ \
              || ! "$build_number" =~ ^[1-9][0-9]*(\.[1-9][0-9]*)?$ \
              || "$distribution_version" != "$version-build.$build_number" ]]; then
            echo "error: invalid or inconsistent build version metadata" >&2
            exit 1
          fi
          cd build-macos/dist
          base="YouKnow-${distribution_version}-macOS-universal"
          test -s "$base.zip"
          test -s "$base.pkg"
          unzip -tq "$base.zip"
          shasum -a 256 "$base.zip" "$base.pkg" > SHA256SUMS.txt

      - name: Upload macOS packages
        uses: actions/upload-artifact@v4
        with:
          name: ci-macos
          path: |
            build-macos/dist/YouKnow-*-macOS-universal.zip
            build-macos/dist/YouKnow-*-macOS-universal.pkg
            build-macos/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  embedded-tables:
    name: Immutable DSP tables (Linux)
    runs-on: ubuntu-24.04
    # Exact transcendental reproduction uses the generation environment's
    # GCC 14 / glibc 2.41 family; the Rack SDK build consumes the fixed values.
    container: debian:trixie
    timeout-minutes: 15
    steps:
      - name: Install the table generator toolchain
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git g++ python3
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Native builders and embedded accessors agree
        run: python3 Tools/generate_frozen_tables.py --check --cxx g++

  sanitizers:
    name: Unit and fuzz tiers under ASan + UBSan (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install JUCE Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config xvfb xauth \
            libasound2-dev \
            libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev

      # The plug-in is built too: the fuzz tier drives the shipping processor.
      # GCC, not Clang: Clang links the ASan runtime only into executables, so
      # the plug-in modules' no-undefined link leaves __asan_* unresolved; GCC
      # links the shared libasan into every module.
      - name: Configure
        run: |
          cmake \
            -S . \
            -B build-asan \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DYOUKNOW_ENABLE_SANITIZERS=ON \
            -DYOUKNOW_BUILD_PLUGIN=ON \
            -DYOUKNOW_BUILD_CLAP=OFF \
            -DBUILD_TESTING=ON

      - name: Build, including the C++17 Rack proof YouKnowDSPCxx17
        run: cmake --build build-asan --parallel

      # Instrumented, the unit tier is several CPU-hours; run it across the
      # runner's cores. The build scales every test timeout for sanitizers.
      - name: Unit and fuzz tiers
        run: |
          xvfb-run --auto-servernum ctest --test-dir build-asan \
            --parallel "$(nproc)" \
            -L "^(unit|fuzz)$" --output-on-failure --no-tests=error

      # libFuzzer needs Clang; it builds its own instrumented DSP copy.
      - name: Build the libFuzzer DSP harness
        run: |
          sudo apt-get install -y --no-install-recommends clang
          cmake -S . -B build-fuzz -G Ninja \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DYOUKNOW_BUILD_PLUGIN=OFF -DYOUKNOW_BUILD_FUZZER=ON -DBUILD_TESTING=OFF
          cmake --build build-fuzz --parallel --target YouKnowDspFuzz

      - name: Fuzz the DSP input boundary (fixed seed, 2 minutes)
        run: |
          mkdir -p build-fuzz/corpus build-fuzz/fuzz-artifacts
          build-fuzz/YouKnowDspFuzz build-fuzz/corpus \
            -seed=20261017 -max_total_time=120 -max_len=4096 \
            -timeout=60 -rss_limit_mb=2048 \
            -artifact_prefix=build-fuzz/fuzz-artifacts/

      - name: Upload fuzz reproducers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dsp-fuzz-reproducers
          path: build-fuzz/fuzz-artifacts
          if-no-files-found: ignore
          retention-days: 7

  dsp-tests-windows:
    name: DSP tests and plug-in package (Windows x64)
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test Windows archive replacement and payload checks
        run: python scripts/test-ci-packaging.py WindowsPackagingTests

      - name: Configure DSP tests
        run: |
          cmake -S . -B build-win -A x64 -DYOUKNOW_BUILD_PLUGIN=OFF -DBUILD_TESTING=ON "-DCMAKE_EXE_LINKER_FLAGS=/STACK:33554432"

      - name: Build and test DSP engine
        run: |
          cmake --build build-win --config Release --parallel
          ctest --test-dir build-win -C Release -L unit --output-on-failure --no-tests=error

      - name: Configure Windows plug-in build
        run: |
          cmake -S . -B build-win -DYOUKNOW_BUILD_PLUGIN=ON -DYOUKNOW_BUILD_CLAP=ON -DBUILD_TESTING=ON

      - name: Build Windows plug-ins and host-boundary tests
        run: |
          cmake --build build-win --config Release --parallel \
            --target YouKnow_VST3 YouKnow_CLAP YouKnow_Standalone \
              YouKnowPluginProcessorTests YouKnowCLAPBundleSmokeTests \
              YouKnowVST3BundleSmokeTests

      - name: Test Windows processor and plug-in host boundaries
        run: |
          set -euo pipefail
          for suite in PluginProcessor CLAPBundle VST3Bundle; do
            ctest --test-dir build-win -C Release --output-on-failure \
              -R "^YouKnow\\.${suite}$" --no-tests=error
          done

      - name: Validate the plug-ins (pluginval, clap-validator, auval on macOS)
        shell: bash
        run: ./scripts/validate-plugins.sh build-win YouKnow aumu Yk06 Ykno 0x594b4e4f

      - name: Package Windows VST3, CLAP and standalone
        run: python scripts/package-windows.py --build-dir build-win

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: ci-windows
          path: |
            build-win/dist/YouKnow-*-Windows-x64.zip
            build-win/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
