name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# Superseded PR checks can stop, but every main push must finish its packages.
# A run-specific group also prevents pending main runs from replacing each other.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dsp-tests:
    name: DSP tests (JUCE-free, Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Test CI packaging and preview refresh
        run: python3 scripts/test-ci-packaging.py

      - name: Install JUCE Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config \
            libasound2-dev \
            libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev

      - name: Configure
        run: |
          cmake \
            -S . \
            -B build-dsp \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DYOUKNOW_BUILD_PLUGIN=OFF \
            -DBUILD_TESTING=ON

      - name: Build and test DSP engine
        run: |
          cmake --build build-dsp --parallel
          ctest --test-dir build-dsp --output-on-failure

      # The count is the point of the check: it is what turns "the renderer ran"
      # into "the renderer rendered the whole set", so a take that silently
      # stopped being written fails CI instead of leaving a stale WAV committed
      # forever. Adding or removing a take means updating the number here in the
      # same change.
      - name: Render and verify demo audio
        run: |
          set -euo pipefail
          cmake --build build-dsp --target YouKnowRenderDemos --parallel
          # Only this run's complete render can satisfy the count below.
          # Frozen evidence lives in subdirectories and is not removed.
          rm -f Docs/audio/*.wav
          ./build-dsp/YouKnowRenderDemos Docs/audio
          rendered=$(find Docs/audio -maxdepth 1 -name '*.wav' | wc -l)
          if (( rendered != 10 )); then
            echo "error: rendered $rendered demo WAVs, expected 10" >&2
            exit 1
          fi
          echo "YouKnow: rendered all $rendered demo WAVs"

      # Two checks, because neither alone says the piece is whole. The byte
      # count catches a render that stopped early, but it depends only on
      # duration and format: dropping every part but the one that sets the last
      # release would produce the same size. The part count is what holds the
      # ten-overdub contract the README states. Changing the number of parts
      # means changing the number here in the same commit.
      - name: Render and verify the composition
        run: |
          set -euo pipefail
          cmake --build build-dsp --target YouKnowRenderComposition --parallel
          rm -f Docs/audio/composition/*.wav
          ./build-dsp/YouKnowRenderComposition Docs/audio/composition | tee render.log
          piece=Docs/audio/composition/youknow-composition.wav
          test -f "$piece"
          parts=$(grep -c '^Rendered [AB][0-9]' render.log)
          if (( parts != 10 )); then
            echo "error: the composition rendered $parts parts, expected 10" >&2
            exit 1
          fi
          bytes=$(stat -c%s "$piece")
          if (( bytes < 10000000 )); then
            echo "error: the composition is only $bytes bytes" >&2
            exit 1
          fi
          rm -f render.log
          echo "YouKnow: rendered the composition, $parts parts, $bytes bytes"

      - name: Archive the refreshed audio demos and peak table
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          tar -czf audio-previews.tar.gz README.md Docs/audio/*.wav \
            Docs/audio/composition/youknow-composition.wav

      - name: Upload the refreshed audio demos
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ci-audio-previews
          path: audio-previews.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Configure Linux plug-in build
        run: |
          cmake \
            -S . \
            -B build-dsp \
            -DCMAKE_BUILD_TYPE=Release \
            -DYOUKNOW_BUILD_PLUGIN=ON \
            -DBUILD_TESTING=OFF

      - name: Build Linux VST3 and standalone
        run: |
          cmake --build build-dsp --parallel \
            --target YouKnow_VST3 YouKnow_Standalone

      - name: Package Linux VST3 and standalone
        run: |
          set -euo pipefail
          artefacts="build-dsp/YouKnow_artefacts/Release"
          test -d "$artefacts/VST3/YouKnow.vst3"
          test -x "$artefacts/Standalone/YouKnow"
          dist="build-dsp/dist"
          mkdir -p "$dist"
          archive="$dist/YouKnow-Linux-x64.tar.gz"
          # Licence and notice files ship inside the binary archive (the MIT
          # licence requires the notice to accompany binaries).
          contents=("VST3/YouKnow.vst3" "Standalone/YouKnow")
          for notice in LICENSE THIRD_PARTY_NOTICES.md ThirdParty/JUCE-LICENSE.md; do
            if [[ -f "$notice" ]]; then
              cp "$notice" "$artefacts/$(basename "$notice")"
              contents+=("$(basename "$notice")")
            fi
          done
          tar -czf "$archive" -C "$artefacts" "${contents[@]}"
          test -s "$archive"
          tar -tzf "$archive" >/dev/null

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: ci-linux
          path: build-dsp/dist/YouKnow-Linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 7

  plugin-macos:
    name: Plug-in build and package (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Clearing the committed screenshot first is what makes the check after
      # the build meaningful: the file can only be there afterwards because this
      # run's suite rendered it.
      - name: Clear screenshot before rendering
        run: rm -f Docs/screenshots/youknow-standalone.png

      # PRs check the runner's native architecture. Main pushes and manual runs
      # build both arm64 and x86_64 for the downloadable distribution.
      - name: Build plug-in and run tests
        env:
          BUILD_UNIVERSAL: ${{ github.event_name == 'pull_request' && 'OFF' || 'ON' }}
          YOUKNOW_EDITOR_SNAPSHOT: "${{ github.workspace }}/Docs/screenshots/youknow-standalone.png"
        run: ./scripts/build-macos.sh

      - name: Check that the editor screenshot was rendered
        run: |
          set -euo pipefail
          screenshot="Docs/screenshots/youknow-standalone.png"
          if [[ ! -s "$screenshot" ]]; then
            echo "error: the suite did not render $screenshot" >&2
            echo "The suite must honour YOUKNOW_EDITOR_SNAPSHOT." >&2
            exit 1
          fi
          if [[ "$(head -c 8 "$screenshot" | od -An -tx1 | tr -d ' \n')" != "89504e470d0a1a0a" ]]; then
            echo "error: $screenshot does not carry the PNG signature" >&2
            exit 1
          fi
          if [[ "$(tail -c 8 "$screenshot" | od -An -tx1 | tr -d ' \n')" != "49454e44ae426082" ]]; then
            echo "error: $screenshot has no terminating IEND chunk, so the write did not finish" >&2
            exit 1
          fi
          echo "Rendered $screenshot ($(wc -c < "$screenshot") bytes)."

      - name: Archive the refreshed editor screenshot
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: tar -czf editor-preview.tar.gz Docs/screenshots/youknow-standalone.png

      - name: Upload the refreshed editor screenshot
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ci-editor-preview
          path: editor-preview.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Package macOS VST3, Audio Unit, CLAP and standalone
        if: github.event_name != 'pull_request'
        run: ./scripts/sign-and-package-macos.sh

      - name: Verify macOS packages and write checksums
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          version="$(sed -n 's/^CMAKE_PROJECT_VERSION:STATIC=//p' build-macos/CMakeCache.txt)"
          [[ "$version" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]]
          cd build-macos/dist
          base="YouKnow-${version}-macOS-universal"
          test -s "$base.zip"
          test -s "$base.pkg"
          unzip -tq "$base.zip"
          shasum -a 256 "$base.zip" "$base.pkg" > SHA256SUMS.txt

      - name: Upload macOS packages
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ci-macos
          path: |
            build-macos/dist/YouKnow-*-macOS-universal.zip
            build-macos/dist/YouKnow-*-macOS-universal.pkg
            build-macos/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  refresh-previews:
    name: Refresh the committed screenshot and audio demos
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [dsp-tests, plugin-macos, dsp-tests-windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download the rendered audio demos and peak table
        uses: actions/download-artifact@v4
        with:
          name: ci-audio-previews
          path: ${{ runner.temp }}/youknow-previews

      - name: Download the rendered screenshot
        uses: actions/download-artifact@v4
        with:
          name: ci-editor-preview
          path: ${{ runner.temp }}/youknow-previews

      - name: Commit the refreshed previews if they changed
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_DIR: ${{ runner.temp }}/youknow-previews
        run: bash scripts/refresh-previews.sh

  dsp-tests-windows:
    name: DSP tests and plug-in package (Windows x64)
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure DSP tests
        run: |
          cmake -S . -B build-win -A x64 -DYOUKNOW_BUILD_PLUGIN=OFF -DBUILD_TESTING=ON "-DCMAKE_EXE_LINKER_FLAGS=/STACK:33554432"

      - name: Build and test DSP engine
        run: |
          cmake --build build-win --config Release --parallel
          ctest --test-dir build-win -C Release --output-on-failure

      - name: Configure Windows plug-in build
        run: |
          cmake -S . -B build-win -DYOUKNOW_BUILD_PLUGIN=ON -DYOUKNOW_BUILD_CLAP=ON -DBUILD_TESTING=ON

      - name: Build Windows VST3, CLAP and standalone
        run: |
          cmake --build build-win --config Release --parallel --target YouKnow_VST3 YouKnow_CLAP YouKnow_Standalone YouKnowCLAPBundleSmokeTests

      - name: Test the Windows CLAP host boundary
        run: ctest --test-dir build-win -C Release --output-on-failure -R '^YouKnow\.CLAPBundle$' --no-tests=error

      - name: Package Windows VST3, CLAP and standalone
        run: python scripts/package-windows.py --build-dir build-win

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: ci-windows
          path: |
            build-win/dist/YouKnow-*-Windows-x64.zip
            build-win/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
