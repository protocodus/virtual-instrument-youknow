name: Main build

# Every push to main, nightly and on demand: render the README's screenshot and
# demos, validate and package every platform, collect one downloadable set,
# then commit the refreshed media and README blocks if main has not moved.
# The test tiers run in ci.yml; this workflow builds what it publishes.
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

# No shared concurrency group: GitHub would otherwise replace pending runs,
# skipping builds when several pushes arrive close together.

env:
  BUILD_NUMBER: ${{ github.run_number }}

jobs:
  render-preset-demos:
    name: Render the preset and More demos
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Ninja
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ninja-build

      - name: Build the preset demo renderer
        run: |
          cmake -S . -B build-dsp -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DYOUKNOW_BUILD_PLUGIN=OFF -DBUILD_TESTING=OFF
          cmake --build build-dsp --parallel --target RenderYouKnowPresetDemos

      # Fails unless every phrase renders finite, audible, within the ceiling
      # and 8-12 s long, with at most 8 preset and 4 More demos (G3, G3d, G6).
      - name: Render the demos
        run: |
          ./build-dsp/RenderYouKnowPresetDemos --jobs 4 Docs/audio/midi generated-media/preset-demos
          ./build-dsp/RenderYouKnowPresetDemos --more --jobs 4 Docs/audio/midi/more generated-media/more-demos

      - name: Upload the demos
        uses: actions/upload-artifact@v4
        with:
          name: generated-preset-demos
          path: generated-media
          if-no-files-found: error
          retention-days: 30

  # U7: the perf tier's figures for the record, one file per main build. Its
  # own job, because the timed renders run on one thread for most of an hour.
  cpu-figures:
    name: Time the demos (perf tier)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Ninja
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ninja-build

      - name: Build the preset demo renderer
        run: |
          cmake -S . -B build-dsp -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DYOUKNOW_BUILD_PLUGIN=OFF -DBUILD_TESTING=OFF
          cmake --build build-dsp --parallel --target RenderYouKnowPresetDemos

      - name: Time the demos
        run: |
          ./build-dsp/RenderYouKnowPresetDemos --cpu --json build-dsp/cpu.json --note "${GITHUB_SHA}" Docs/audio/midi

      - name: Upload the CPU figures
        uses: actions/upload-artifact@v4
        with:
          name: cpu-youknow-main-build-${{ github.run_number }}
          path: build-dsp/cpu.json
          if-no-files-found: error
          retention-days: 30

  build-macos:
    name: macOS universal VST3, AU, CLAP and standalone
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build universal plug-in and render the editor screenshot (render tier)
        env:
          BUILD_UNIVERSAL: "ON"
          TEST_LABEL: "^render$"
        run: ./scripts/build-macos.sh

      # Archived only after the render tier passed: a run whose editor
      # assertions failed may still have written a PNG.
      - name: Archive the rendered screenshot
        run: |
          set -euo pipefail
          mkdir -p Docs/screenshots generated-media
          cp build-macos/render/youknow.png Docs/screenshots/youknow.png
          tar -czf generated-media/editor-preview.tar.gz Docs/screenshots/youknow.png

      - name: Upload the rendered screenshot
        uses: actions/upload-artifact@v4
        with:
          name: generated-screenshot
          path: generated-media
          if-no-files-found: error
          retention-days: 30

      - name: Validate the plug-ins (pluginval, clap-validator, auval on macOS)
        shell: bash
        run: ./scripts/validate-plugins.sh build-macos YouKnow aumu Yk06 Ykno 0x594b4e4f

      - name: Package (ad-hoc-signed bundles)
        run: ./scripts/sign-and-package-macos.sh

      - name: Upload macOS packages
        uses: actions/upload-artifact@v4
        with:
          name: main-build-packages-${{ github.run_number }}-macos
          path: |
            build-macos/dist/YouKnow-*-build.${{ github.run_number }}-macOS-universal.zip
            build-macos/dist/YouKnow-*-build.${{ github.run_number }}-macOS-universal.pkg
          if-no-files-found: error
          retention-days: 30

  build-linux:
    name: Linux VST3, CLAP and standalone
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install JUCE Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config xvfb xauth \
            libasound2-dev \
            libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev

      - name: Build Linux VST3, CLAP and standalone
        run: |
          cmake -S . -B build-plugin -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DYOUKNOW_BUILD_PLUGIN=ON -DYOUKNOW_BUILD_CLAP=ON -DBUILD_TESTING=OFF
          cmake --build build-plugin --parallel --target YouKnow_VST3 YouKnow_CLAP YouKnow_Standalone

      - name: Validate the plug-ins (pluginval, clap-validator, auval on macOS)
        shell: bash
        run: ./scripts/validate-plugins.sh build-plugin YouKnow aumu Yk06 Ykno 0x594b4e4f

      - name: Package Linux VST3, CLAP and standalone
        run: python3 scripts/package-linux.py --build-dir build-plugin

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: main-build-packages-${{ github.run_number }}-linux
          path: build-plugin/dist/YouKnow-*-build.${{ github.run_number }}-Linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 30

  build-windows:
    name: Windows x64 VST3, CLAP and standalone
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Windows VST3, CLAP and standalone
        run: |
          cmake -S . -B build-win -A x64 -DYOUKNOW_BUILD_PLUGIN=ON -DYOUKNOW_BUILD_CLAP=ON -DBUILD_TESTING=OFF
          cmake --build build-win --config Release --parallel --target YouKnow_VST3 YouKnow_CLAP YouKnow_Standalone

      - name: Validate the plug-ins (pluginval, clap-validator, auval on macOS)
        shell: bash
        run: ./scripts/validate-plugins.sh build-win YouKnow aumu Yk06 Ykno 0x594b4e4f

      - name: Package Windows VST3, CLAP and standalone
        run: python scripts/package-windows.py --build-dir build-win

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: main-build-packages-${{ github.run_number }}-windows
          path: build-win/dist/YouKnow-*-build.${{ github.run_number }}-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30

  # The whole U9 parameter-extremes matrix, nightly and on demand: about
  # 12,900 cases in rotation, in 8 shards. ci.yml runs shard 0 of 256 under
  # ASan + UBSan on every push.
  parameter-matrix:
    name: Parameter-extremes matrix, shard ${{ matrix.shard }} of 8
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install JUCE Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config xvfb xauth \
            libasound2-dev \
            libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev
      - name: Build the matrix
        run: |
          cmake -S . -B build-matrix -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DYOUKNOW_BUILD_PLUGIN=ON -DYOUKNOW_BUILD_CLAP=OFF -DBUILD_TESTING=ON
          cmake --build build-matrix --parallel --target YouKnowParameterMatrixTests
      - name: Run shard ${{ matrix.shard }}
        run: |
          xvfb-run -a build-matrix/YouKnowParameterMatrixTests \
            --jobs "$(nproc)" --rotation --shard ${{ matrix.shard }}/8

  # The long libFuzzer run (U8); ci.yml runs the same harness for 2 minutes.
  dsp-fuzz:
    name: Fuzz the DSP input boundary (30 minutes)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build the libFuzzer DSP harness
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang ninja-build
          cmake -S . -B build-fuzz -G Ninja \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DYOUKNOW_BUILD_PLUGIN=OFF -DYOUKNOW_BUILD_FUZZER=ON -DBUILD_TESTING=OFF
          cmake --build build-fuzz --parallel --target YouKnowDspFuzz
      - name: Fuzz
        run: |
          mkdir -p build-fuzz/corpus build-fuzz/fuzz-artifacts
          build-fuzz/YouKnowDspFuzz build-fuzz/corpus \
            -seed=${{ github.run_number }} -max_total_time=1800 -max_len=4096 \
            -timeout=60 -rss_limit_mb=2048 -jobs=4 -workers=4 \
            -artifact_prefix=build-fuzz/fuzz-artifacts/
      - name: Upload fuzz reproducers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dsp-fuzz-reproducers
          path: |
            build-fuzz/fuzz-artifacts
            fuzz-*.log
          if-no-files-found: ignore
          retention-days: 30

  collect:
    name: Collect youknow-main-build-${{ github.run_number }}
    needs: [render-preset-demos, build-macos, build-linux, build-windows]
    runs-on: ubuntu-24.04
    outputs:
      artifact-url: ${{ steps.upload.outputs.artifact-url }}
    steps:
      - name: Download every package
        uses: actions/download-artifact@v4
        with:
          pattern: main-build-packages-${{ github.run_number }}-*
          merge-multiple: true
          path: dist

      - name: Check the package set
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(dist/YouKnow-*-build."${BUILD_NUMBER}"-*)
          printf 'Package: %s\n' "${packages[@]}"
          for suffix in macOS-universal.zip macOS-universal.pkg Linux-x64.tar.gz Windows-x64.zip; do
            matches=(dist/YouKnow-*-build."${BUILD_NUMBER}"-"$suffix")
            if (( ${#matches[@]} != 1 )) || [[ ! -s "${matches[0]}" ]]; then
              echo "error: expected one non-empty *-$suffix package" >&2
              exit 1
            fi
          done
          versions="$(printf '%s\n' "${packages[@]##*/}" | sed -E 's/^YouKnow-([0-9.]+)-build\..*/\1/' | sort -u)"
          if (( ${#packages[@]} != 4 )) || [[ "$(wc -l <<<"$versions")" != 1 ]]; then
            echo "error: expected four packages of one version" >&2
            exit 1
          fi

      - name: Write BUILD.txt and SHA256SUMS
        working-directory: dist
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          printf 'Repository: %s\nCommit: %s\nBuild number: %s\nRun: %s\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$BUILD_NUMBER" "$RUN_URL" > BUILD.txt
          sha256sum YouKnow-* BUILD.txt > SHA256SUMS

      - name: Upload youknow-main-build-${{ github.run_number }}
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: youknow-main-build-${{ github.run_number }}
          path: dist
          if-no-files-found: error
          retention-days: 30

  publish-media:
    name: Commit screenshot, demos and README blocks
    if: github.ref == 'refs/heads/main'
    needs: collect
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download the rendered media
        uses: actions/download-artifact@v4
        with:
          pattern: generated-*
          merge-multiple: true
          path: ${{ runner.temp }}/youknow-previews

      - name: Commit refreshed media if main still matches this build
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_DIR: ${{ runner.temp }}/youknow-previews
          DISTRIBUTION_URL: ${{ needs.collect.outputs.artifact-url }}
        run: bash scripts/refresh-previews.sh
