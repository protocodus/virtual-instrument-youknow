name: Nightly

on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    name: Build packages and refresh previews
    permissions:
      # The called workflow grants write access only to its preview commit job.
      contents: write
    uses: ./.github/workflows/ci.yml
