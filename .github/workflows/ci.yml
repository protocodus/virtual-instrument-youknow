name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# Superseded PR checks can stop, but every main push must finish its packages.
# A run-specific group also prevents pending main runs from replacing each other.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # A pinned pluginval release, each archive checked against its SHA-256.
  # The main build and release.yml both run this workflow, so their plug-ins
  # are validated here (pluginval does not load CLAP).
  PLUGINVAL_VERSION: v1.0.4
  PLUGINVAL_LINUX_SHA256: c01c49d8063965c4c2dea8324468336768f5c9139e0b1caebde14c2400b55352
  PLUGINVAL_MACOS_SHA256: 3c4c533bda0c5059eea3ddaea752d757ee2025041f0f47e6bcb0e87f6082b29f
  PLUGINVAL_WINDOWS_SHA256: c08e61ce3b96db41636f8ec7e76f4c7e2c13ebdac7fa1b5a1f52b4f32ec715ab

jobs:
  dsp-tests:
    name: DSP tests (JUCE-free, Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Test CI packaging and preview refresh
        run: python3 scripts/test-ci-packaging.py

      - name: Install JUCE Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config xvfb xauth \
            libasound2-dev \
            libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev

      - name: Configure
        run: |
          cmake \
            -S . \
            -B build-dsp \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DYOUKNOW_BUILD_PLUGIN=OFF \
            -DBUILD_TESTING=ON

      - name: Build and test DSP engine
        run: |
          cmake --build build-dsp --parallel
          ctest --test-dir build-dsp -L unit --output-on-failure --no-tests=error

      # The count is the point of the check: it is what turns "the renderer ran"
      # into "the renderer rendered the whole set", so a take that silently
      # stopped being written fails CI instead of leaving a stale WAV committed
      # forever. Adding or removing a take means updating the number here in the
      # Verifies that all 31 demo WAVs (10 mechanism demos, 1 composition,
      # 5 musical showcases, and 15 factory preset demos) and the showcase
      # manifest are rendered into Docs/audio and meet size requirements.
      - name: Render and verify demo audio
        run: |
          set -euo pipefail
          cmake --build build-dsp --target YouKnowRebuildDemos --parallel
          rendered=$(find Docs/audio -maxdepth 1 -name '*.wav' | wc -l)
          if (( rendered != 31 )); then
            echo "error: rendered $rendered demo WAVs, expected 31" >&2
            exit 1
          fi
          test -f Docs/audio/showcase-manifest.json
          piece=Docs/audio/youknow-composition.wav
          test -f "$piece"
          bytes=$(stat -c%s "$piece")
          if (( bytes < 10000000 )); then
            echo "error: the composition is only $bytes bytes" >&2
            exit 1
          fi
          echo "YouKnow: rendered all $rendered demo WAVs and verified composition ($bytes bytes)"

      - name: Archive the refreshed audio demos and peak table
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          tar -czf audio-previews.tar.gz README.md Docs/audio/*.wav \
            Docs/audio/showcase-manifest.json

      - name: Upload the refreshed audio demos
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ci-audio-previews
          path: audio-previews.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Configure Linux plug-in build
        run: |
          cmake \
            -S . \
            -B build-dsp \
            -DCMAKE_BUILD_TYPE=Release \
            -DYOUKNOW_BUILD_PLUGIN=ON \
            -DYOUKNOW_BUILD_CLAP=ON \
            -DBUILD_TESTING=ON

      - name: Build Linux plug-ins and host-boundary tests
        run: |
          cmake --build build-dsp --parallel \
            --target YouKnow_VST3 YouKnow_CLAP YouKnow_Standalone \
              YouKnowPluginProcessorTests YouKnowCLAPBundleSmokeTests \
              YouKnowVST3BundleSmokeTests

      - name: Test Linux processor and plug-in host boundaries
        run: |
          set -euo pipefail
          # The editor fixture and JUCE host initialise GUI services. Give them
          # an isolated display; require each registration, not just any match.
          for suite in PluginProcessor CLAPBundle VST3Bundle; do
            xvfb-run --auto-servernum ctest --test-dir build-dsp \
              --output-on-failure -R "^YouKnow\\.${suite}$" --no-tests=error
          done

      - name: Validate the VST3 with pluginval
        working-directory: build-dsp
        run: |
          set -euo pipefail
          curl -sSfL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/${PLUGINVAL_VERSION}/pluginval_Linux.zip"
          echo "${PLUGINVAL_LINUX_SHA256}  pluginval.zip" | sha256sum -c -
          unzip -q -o pluginval.zip
          xvfb-run -a ./pluginval --strictness-level 10 --verbose \
            --validate "YouKnow_artefacts/Release/VST3/YouKnow.vst3"

      - name: Package Linux VST3, CLAP and standalone
        run: python3 scripts/package-linux.py --build-dir build-dsp

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: ci-linux
          path: |
            build-dsp/dist/YouKnow-*-Linux-x64.tar.gz
            build-dsp/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  plugin-macos:
    name: Plug-in build and package (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The bundle-version checks require macOS and are skipped by the Linux
      # script job. Preflight uses disposable sources and mocked signing tools.
      - name: Test macOS packaging and release preflight
        run: |
          python3 scripts/test-ci-packaging.py
          bash scripts/test-release-preflight.sh

      # Clearing the committed screenshot first is what makes the check after
      # the build meaningful: the file can only be there afterwards because this
      # run's suite rendered it.
      - name: Clear screenshot before rendering
        run: rm -f Docs/screenshots/youknow-standalone.png

      # PRs check the runner's native architecture. Main pushes and manual runs
      # build both arm64 and x86_64 for the downloadable distribution.
      - name: Build plug-in and run tests
        env:
          BUILD_UNIVERSAL: ${{ github.event_name == 'pull_request' && 'OFF' || 'ON' }}
          YOUKNOW_EDITOR_SNAPSHOT: "${{ github.workspace }}/Docs/screenshots/youknow-standalone.png"
        run: ./scripts/build-macos.sh

      - name: Check that the editor screenshot was rendered
        run: |
          set -euo pipefail
          screenshot="Docs/screenshots/youknow-standalone.png"
          if [[ ! -s "$screenshot" ]]; then
            echo "error: the suite did not render $screenshot" >&2
            echo "The suite must honour YOUKNOW_EDITOR_SNAPSHOT." >&2
            exit 1
          fi
          if [[ "$(head -c 8 "$screenshot" | od -An -tx1 | tr -d ' \n')" != "89504e470d0a1a0a" ]]; then
            echo "error: $screenshot does not carry the PNG signature" >&2
            exit 1
          fi
          if [[ "$(tail -c 8 "$screenshot" | od -An -tx1 | tr -d ' \n')" != "49454e44ae426082" ]]; then
            echo "error: $screenshot has no terminating IEND chunk, so the write did not finish" >&2
            exit 1
          fi
          echo "Rendered $screenshot ($(wc -c < "$screenshot") bytes)."

      - name: Validate the AU with auval
        run: |
          set -euo pipefail
          components="$HOME/Library/Audio/Plug-Ins/Components"
          mkdir -p "$components"
          ditto "build-macos/YouKnow_artefacts/Release/AU/YouKnow.component" "$components/YouKnow.component"
          # The registrar caches the component list; restarting it rescans.
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          auval -strict -v aumu Yk06 Ykno

      - name: Validate the VST3 with pluginval
        working-directory: build-macos
        run: |
          set -euo pipefail
          curl -sSfL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/${PLUGINVAL_VERSION}/pluginval_macOS.zip"
          echo "${PLUGINVAL_MACOS_SHA256}  pluginval.zip" | shasum -a 256 -c -
          ditto -x -k pluginval.zip .
          pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --verbose \
            --validate "YouKnow_artefacts/Release/VST3/YouKnow.vst3"

      - name: Archive the refreshed editor screenshot
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: tar -czf editor-preview.tar.gz Docs/screenshots/youknow-standalone.png

      - name: Upload the refreshed editor screenshot
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ci-editor-preview
          path: editor-preview.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Package macOS VST3, Audio Unit, CLAP and standalone
        if: github.event_name != 'pull_request'
        run: ./scripts/sign-and-package-macos.sh

      - name: Verify macOS packages and write checksums
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          cache="build-macos/CMakeCache.txt"
          version="$(sed -n 's/^CMAKE_PROJECT_VERSION:STATIC=//p' "$cache")"
          build_number="$(sed -n 's/^YOUKNOW_BUILD_NUMBER:STRING=//p' "$cache")"
          distribution_version="$(sed -n 's/^YOUKNOW_DISTRIBUTION_VERSION:INTERNAL=//p' "$cache")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ \
              || ! "$build_number" =~ ^[1-9][0-9]*(\.[1-9][0-9]*)?$ \
              || "$distribution_version" != "$version-build.$build_number" ]]; then
            echo "error: invalid or inconsistent build version metadata" >&2
            exit 1
          fi
          cd build-macos/dist
          base="YouKnow-${distribution_version}-macOS-universal"
          test -s "$base.zip"
          test -s "$base.pkg"
          unzip -tq "$base.zip"
          shasum -a 256 "$base.zip" "$base.pkg" > SHA256SUMS.txt

      - name: Upload macOS packages
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ci-macos
          path: |
            build-macos/dist/YouKnow-*-macOS-universal.zip
            build-macos/dist/YouKnow-*-macOS-universal.pkg
            build-macos/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  embedded-tables:
    name: Immutable DSP tables (Linux)
    runs-on: ubuntu-24.04
    # Exact transcendental reproduction uses the generation environment's
    # GCC 14 / glibc 2.41 family; the Rack SDK build consumes the fixed values.
    container: debian:trixie
    timeout-minutes: 15
    steps:
      - name: Install the table generator toolchain
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git g++ python3
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Native builders and embedded accessors agree
        run: python3 Tools/generate_frozen_tables.py --check --cxx g++

  sanitizers:
    name: Unit and fuzz tiers under ASan + UBSan (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      # Leaks are off: these binaries have never been leak-checked, and an
      # unreviewed leak verdict should not become the gate.
      ASAN_OPTIONS: detect_leaks=0
      UBSAN_OPTIONS: print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install JUCE Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config xvfb xauth \
            libasound2-dev \
            libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev

      # The plug-in is built too: the fuzz tier drives the shipping processor.
      # GCC, not Clang: Clang links the ASan runtime only into executables, so
      # the plug-in modules' no-undefined link leaves __asan_* unresolved; GCC
      # links the shared libasan into every module.
      - name: Configure
        run: |
          cmake \
            -S . \
            -B build-asan \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DYOUKNOW_ENABLE_SANITIZERS=ON \
            -DYOUKNOW_BUILD_PLUGIN=ON \
            -DYOUKNOW_BUILD_CLAP=OFF \
            -DBUILD_TESTING=ON

      - name: Build, including the C++17 Rack proof YouKnowDSPCxx17
        run: cmake --build build-asan --parallel

      # Instrumented, the unit tier is several CPU-hours; run it across the
      # runner's cores. The build scales every test timeout for sanitizers.
      - name: Unit and fuzz tiers
        run: |
          xvfb-run --auto-servernum ctest --test-dir build-asan \
            --parallel "$(nproc)" \
            -L "^(unit|fuzz)$" --output-on-failure --no-tests=error

  refresh-previews:
    name: Refresh the committed screenshot and audio demos
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [dsp-tests, plugin-macos, dsp-tests-windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download the rendered audio demos and peak table
        uses: actions/download-artifact@v4
        with:
          name: ci-audio-previews
          path: ${{ runner.temp }}/youknow-previews

      - name: Download the rendered screenshot
        uses: actions/download-artifact@v4
        with:
          name: ci-editor-preview
          path: ${{ runner.temp }}/youknow-previews

      - name: Commit the refreshed previews if they changed
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_DIR: ${{ runner.temp }}/youknow-previews
        run: bash scripts/refresh-previews.sh

  dsp-tests-windows:
    name: DSP tests and plug-in package (Windows x64)
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Test Windows archive replacement and payload checks
        run: python scripts/test-ci-packaging.py WindowsPackagingTests

      - name: Configure DSP tests
        run: |
          cmake -S . -B build-win -A x64 -DYOUKNOW_BUILD_PLUGIN=OFF -DBUILD_TESTING=ON "-DCMAKE_EXE_LINKER_FLAGS=/STACK:33554432"

      - name: Build and test DSP engine
        run: |
          cmake --build build-win --config Release --parallel
          ctest --test-dir build-win -C Release -L unit --output-on-failure --no-tests=error

      - name: Configure Windows plug-in build
        run: |
          cmake -S . -B build-win -DYOUKNOW_BUILD_PLUGIN=ON -DYOUKNOW_BUILD_CLAP=ON -DBUILD_TESTING=ON

      - name: Build Windows plug-ins and host-boundary tests
        run: |
          cmake --build build-win --config Release --parallel \
            --target YouKnow_VST3 YouKnow_CLAP YouKnow_Standalone \
              YouKnowPluginProcessorTests YouKnowCLAPBundleSmokeTests \
              YouKnowVST3BundleSmokeTests

      - name: Test Windows processor and plug-in host boundaries
        run: |
          set -euo pipefail
          for suite in PluginProcessor CLAPBundle VST3Bundle; do
            ctest --test-dir build-win -C Release --output-on-failure \
              -R "^YouKnow\\.${suite}$" --no-tests=error
          done

      - name: Validate the VST3 with pluginval
        working-directory: build-win
        run: |
          set -euo pipefail
          curl -sSfL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/${PLUGINVAL_VERSION}/pluginval_Windows.zip"
          echo "${PLUGINVAL_WINDOWS_SHA256}  pluginval.zip" | sha256sum -c -
          7z x -y pluginval.zip
          ./pluginval.exe --strictness-level 10 --verbose \
            --validate "YouKnow_artefacts/Release/VST3/YouKnow.vst3"

      - name: Package Windows VST3, CLAP and standalone
        run: python scripts/package-windows.py --build-dir build-win

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: ci-windows
          path: |
            build-win/dist/YouKnow-*-Windows-x64.zip
            build-win/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
